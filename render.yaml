# Render.com blueprint — Node web service for the ABA001 demo.
#
# This file documents the service that is already running at
# https://aba001.onrender.com (created via the Render API). Opening
# New → Blueprint on this repo would create an equivalent service.
#
# Why a Node service rather than a static site: GitHub Pages is a plain static
# host, but on Render we get a real process — the tiny http server in
# start-prod.cjs gives SPA fallback (/accounts, /transfer/send …) plus a
# /api/health endpoint. Build uses BASE_PATH=/ (root domain), unlike the
# /ABA001/ build used for GitHub Pages.
services:
  - type: web
    name: aba001
    runtime: node
    plan: free
    region: singapore
    buildCommand: corepack enable && pnpm install --no-frozen-lockfile && PORT=5173 BASE_PATH=/ pnpm build
    startCommand: node start-prod.cjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.23.2
      - key: BASE_PATH
        value: /
      - key: NODE_ENV
        value: production
