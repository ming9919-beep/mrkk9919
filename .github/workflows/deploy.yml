name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "10.34.9"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile 2>&1 | tee install.log
      - name: Build
        run: pnpm build 2>&1 | tee build.log
        env:
          BASE_PATH: /ABA001/
          PORT: "5173"
      - name: SPA fallback (copy index.html to 404.html)
        run: cp dist/public/index.html dist/public/404.html
      - name: Deploy to gh-pages branch
        run: |
          cd dist/public
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy: ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
      - name: Upload build logs (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            install.log
            build.log
