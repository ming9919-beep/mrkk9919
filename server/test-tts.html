<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PaySound TTS Test</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{font-family:'Noto Sans Khmer',sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#f5f2ec}
.card{background:#fff;border-radius:16px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
</style>
</head>
<body class="min-h-screen">
<div class="max-w-[430px] mx-auto px-4 py-6">
  <p class="text-xs tracking-[0.2em] text-gray-500 font-medium">PAYSOUND</p>
  <h1 class="text-2xl font-bold text-gray-900 mt-1">高棉语转账播报测试</h1>
  <p class="text-sm text-gray-500 mt-1">输入实际转账金额，转出成功后自动播报</p>

  <div class="card mt-5 p-5 space-y-4">
    <div>
      <label class="text-sm font-semibold text-gray-700">转账金额 Amount</label>
      <input id="amount" type="text" inputmode="decimal" value="12.5"
        class="mt-2 w-full rounded-xl border border-gray-300 p-3 text-lg focus:border-teal-600 focus:outline-none">
    </div>
    <div>
      <label class="text-sm font-semibold text-gray-700">币种 Currency</label>
      <select id="currency"
        class="mt-2 w-full rounded-xl border border-gray-300 p-3 text-lg focus:border-teal-600 focus:outline-none">
        <option value="USD">USD 美金（XXសេន + ដុល្លា）</option>
        <option value="KHR">KHR រៀល 瑞尔</option>
      </select>
    </div>
    <div>
      <label class="text-sm font-semibold text-gray-700">播报模板 Template（**** = 金额位置）</label>
      <input id="template" type="text" value="ជូនដំណឹង ****"
        class="mt-2 w-full rounded-xl border border-gray-300 p-3 text-base focus:border-teal-600 focus:outline-none">
    </div>
  </div>

  <button id="playBtn" class="mt-5 w-full rounded-xl bg-teal-600 py-3 text-white font-medium">
    生成并播放播报
  </button>

  <div class="card mt-4 p-4">
    <p class="text-xs text-gray-500">实际朗读文本（高棉文）：</p>
    <p id="speakText" class="mt-1 text-base text-gray-900 break-words">—</p>
    <p id="status" class="mt-2 text-sm text-gray-500">状态：等待测试</p>
  </div>

  <div class="card mt-4 p-4">
    <p class="text-sm font-semibold text-gray-700 mb-2">快捷测试用例</p>
    <div class="flex flex-wrap gap-2">
      <button class="case rounded-lg bg-gray-100 px-3 py-1.5 text-sm" data-a="0.5" data-c="USD">0.5 USD</button>
      <button class="case rounded-lg bg-gray-100 px-3 py-1.5 text-sm" data-a="12.5" data-c="USD">12.5 USD</button>
      <button class="case rounded-lg bg-gray-100 px-3 py-1.5 text-sm" data-a="12.7" data-c="USD">12.7 USD</button>
      <button class="case rounded-lg bg-gray-100 px-3 py-1.5 text-sm" data-a="100" data-c="USD">100 USD</button>
      <button class="case rounded-lg bg-gray-100 px-3 py-1.5 text-sm" data-a="12500" data-c="KHR">12,500 KHR</button>
      <button class="case rounded-lg bg-gray-100 px-3 py-1.5 text-sm" data-a="100000" data-c="KHR">100,000 KHR</button>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

async function play(){
  const amount = $('amount').value.trim();
  const currency = $('currency').value;
  const template = $('template').value;
  $('status').innerText = '状态：正在请求合成...';
  $('speakText').innerText = '—';
  try{
    const resp = await fetch('/api/khmer-tts', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ amount, currency, template })
    });
    if(!resp.ok){
      let msg = 'HTTP '+resp.status;
      try{ const j = await resp.json(); msg = j.error || msg; }catch(e){}
      throw new Error(msg);
    }
    const ttsText = resp.headers.get('X-TTS-Text');
    if(ttsText) $('speakText').innerText = decodeURIComponent(ttsText);
    const blob = await resp.blob();
    const url = URL.createObjectURL(blob);
    const audio = new Audio(url);
    audio.onended = () => $('status').innerText = '状态：✅ 播放完成';
    await audio.play();
    $('status').innerText = '状态：🔊 播放中...';
  }catch(e){
    $('status').innerText = '状态：❌ 失败：' + e.message;
  }
}

$('playBtn').addEventListener('click', play);
document.querySelectorAll('.case').forEach(btn => {
  btn.addEventListener('click', () => {
    $('amount').value = btn.dataset.a;
    $('currency').value = btn.dataset.c;
    play();
  });
});
</script>
</body>
</html>
